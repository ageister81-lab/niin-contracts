# Publishes @niinid/contracts to npm when a version tag (vX.Y.Z) is pushed (ADR 0011).
# Uses npm trusted publishing (GitHub OIDC): no npm token is stored anywhere, and every release
# carries a signed provenance attestation linking it to this workflow run and commit.
name: release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write # npm trusted publishing + provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - name: Tag must match package.json version
        run: test "v$(node -p 'require("./package.json").version')" = "${GITHUB_REF_NAME}"
      - name: Skip if this version is already on npm (e.g. the first, hand-published 0.1.0)
        id: exists
        run: |
          v=$(node -p 'require("./package.json").version')
          if npm view "@niinid/contracts@${v}" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "::notice::@niinid/contracts@${v} is already on npm; nothing to publish."
          fi
      - if: steps.exists.outputs.published != 'true'
        run: pnpm check
      - if: steps.exists.outputs.published != 'true'
        run: pnpm build
      - if: steps.exists.outputs.published != 'true'
        run: npm publish --provenance --access public
